# Tells Grafana to load any dashboard JSON found in /var/lib/grafana/dashboards
# (mounted from monitoring/grafana/dashboards). So the gRPC dashboard shows up
# automatically on first boot — no manual import.
apiVersion: 1

providers:
  - name: routerbench
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
