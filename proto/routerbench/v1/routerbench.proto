// Protocol Buffers definition for the RouterBench gRPC API.
//
// This .proto file is the single source of truth for the gRPC interface: it
// declares the service (the callable RPC methods) and the messages (the typed
// request/response payloads). Running grpc_tools.protoc on this file generates
// two Python modules:
//   - routerbench_pb2.py       -> the message classes (Row, ResultsResponse, ...)
//   - routerbench_pb2_grpc.py  -> the server base class and client stub
// Clients in any language can generate their own bindings from this same file.

// proto3 is the current Protobuf syntax. A notable rule: scalar fields have no
// "presence" — an unset string is "" and an unset number is 0, not null. We rely
// on this below (empty eval_name == "all", empty model_name on router rows).
syntax = "proto3";

// Logical namespace for the generated types; keeps names from colliding with
// other proto packages when bundled into a larger system. The trailing `.v1` is
// an API version: the wire service name becomes routerbench.v1.RouterBench, and
// the file lives at proto/routerbench/v1/. A breaking change (renumbering or
// removing a field, changing a signature) ships as a new `v2` package alongside
// this one, so existing clients keep working — see buf.yaml's breaking rules.
package routerbench.v1;

// A service is a collection of RPC methods the server exposes. Each rpc names a
// single request message type and a single response message type. This service
// mirrors the REST API: the same two read-only operations, the same data shape.
service RouterBench {
  // Returns all available benchmark names. Takes an empty request because there
  // are no parameters — we still need a message type (proto has no "void").
  rpc GetEvalNames(EvalNamesRequest) returns (EvalNamesResponse);

  // Returns result rows, optionally filtered to a single benchmark.
  rpc GetResults(ResultsRequest) returns (ResultsResponse);

  // Returns chart series for one benchmark, computed by the SAME selection +
  // NDCH logic the matplotlib visualizer uses (see EvaluationResultCollection.
  // get_chart_data), so the frontend chart matches the offline plot exactly.
  rpc GetChartData(ChartRequest) returns (ChartResponse);

  // Live single-prompt routing. Given an arbitrary user task (prompt), each
  // available router (knn/mlp/svm) predicts how every candidate LLM would do
  // and returns its pick plus the full ranking. Unlike the three RPCs above —
  // which serve precomputed benchmark *measurements* — this runs the fitted
  // routers in-process against a brand-new prompt, so the numbers are router
  // *predictions* (expected accuracy) and *estimated* cost, not measured values.
  // The routers are loaded at startup from the persisted run (see RouterStore).
  rpc RouteTask(RouteTaskRequest) returns (RouteTaskResponse);

  // Fit a fresh router set from caller-supplied training data, so routing can be
  // tailored to the caller's own task distribution. The heavy work (embedding +
  // fitting) runs in a background worker; this returns immediately with a job_id.
  rpc TuneRouter(TuneRouterRequest) returns (TuneRouterResponse);

  // Poll a tuning job started by TuneRouter: status, any error, and — once it
  // succeeds — the held-out quality report and the persisted run_id.
  rpc GetTuningStatus(TuningStatusRequest) returns (TuningStatusResponse);

  // List the router sets available to route with: the default global set plus
  // any user-tuned sets, so a client can offer them as a choice for RouteTask's
  // router_set.
  rpc ListRouterSets(ListRouterSetsRequest) returns (ListRouterSetsResponse);

  // Describe the upload contract for TuneRouter (mode "labeled"): the valid model
  // column headers and the minimum-size rules, so a UI can show the exact format
  // and generate a template without hardcoding (and drifting from) the server.
  rpc GetTuningSchema(GetTuningSchemaRequest) returns (GetTuningSchemaResponse);
}

// Empty request: a placeholder type so GetEvalNames has a well-defined signature
// and can be extended later (adding fields stays backward compatible).
message EvalNamesRequest {}

message EvalNamesResponse {
  // `repeated` means a list/array. The `= 1` is the field's wire tag (its
  // identity in the binary encoding), not a default value — tags must stay
  // stable across versions, so never renumber an existing field.
  repeated string eval_names = 1;
}

message ResultsRequest {
  // Optional benchmark filter. Because proto3 strings default to "", an unset
  // value naturally means "all benchmarks" — see GetResults in service.py.
  string eval_name = 1;
}

// One result row, covering both router rows and LLM rows in a single type.
// Fields irrelevant to a given row type are simply left at their default value:
//   - router rows: model_name is "" (empty), params is populated.
//   - llm rows:    params is empty,         model_name is populated.
// (A proto3 `oneof` could model this more strictly, but a flat message keeps the
// client code simple and matches the dict shape returned by data_result.)
message Row {
  string type = 1;          // "router" or "llm"
  string router_type = 2;   // e.g. "mlp", "knn", or "llm"
  string eval_name = 3;
  double performance = 4;   // accuracy in [0, 1]
  double total_cost = 5;    // total cost in USD
  string model_name = 6;            // llm rows only
  map<string, string> params = 7;   // router rows only (hyperparameters)
}

message ResultsResponse {
  repeated Row rows = 1;
}

// ---- Chart data (mirrors EvaluationResultCollection.get_chart_data) ----

message ChartRequest {
  // Required benchmark to chart. Unlike GetResults there is no "all" mode — a
  // performance-vs-cost chart is per benchmark.
  string eval_name = 1;
}

// A single (cost, performance) coordinate, reused for router curves, NDCH
// hulls, LLM baselines and the oracle point.
message ChartPoint {
  double total_cost = 1;
  double performance = 2;
}

// One router curve: the willingness-to-pay sweep of the selected best variant,
// plus its non-decreasing convex hull (the frontier line).
message ChartRouter {
  string name = 1;                    // legend name, e.g. "MLP router"
  string display = 2;                 // short label, e.g. "MLP"
  repeated ChartPoint points = 3;     // the swept operating points
  repeated ChartPoint ndch = 4;       // convex-hull frontier (may be empty)
}

// One LLM baseline scatter point.
message ChartLLM {
  string model_name = 1;
  string display = 2;
  double total_cost = 3;
  double performance = 4;
}

message ChartResponse {
  string eval_name = 1;
  repeated ChartRouter routers = 2;
  repeated ChartLLM llms = 3;
  // Oracle point; singular message field, so absence is detectable via
  // HasField("oracle") when no model answered any prompt correctly.
  ChartPoint oracle = 4;
  // "Zero router" frontier: the convex hull of the LLM baseline points.
  repeated ChartPoint zero_router_ndch = 5;
}

// ---- Live routing (RouteTask) ----

message RouteTaskRequest {
  // The user's task: a free-form prompt / question to route.
  string prompt = 1;
  // The cost/accuracy trade-off knob. 0 (default) ranks purely by predicted
  // performance; > 0 ranks by the cost-adjusted utility the routers use
  // internally (performance * willingness_to_pay - per-token cost terms).
  double willingness_to_pay = 2;
  // Restrict to specific routers (e.g. ["knn", "mlp"]); empty means all that
  // the service has loaded.
  repeated string router_types = 3;
  // Which router set to route with: empty selects the default global set (the
  // latest benchmark run); otherwise the dataset_name of a tuned set produced by
  // TuneRouter. The service lazy-loads and caches the set on first use.
  string router_set = 4;
}

// One candidate LLM as scored by a router for this prompt. predicted_performance
// and estimated_cost are model estimates, never measured — we do not call the
// LLM. Fields 7-9 are reserved for the future "actually invoke the model" mode
// (adding them later is a backward-compatible change).
message ModelScore {
  string model_name = 1;            // raw model id (e.g. "gpt-4-1106-preview")
  string display_name = 2;          // human label (e.g. "GPT-4")
  double predicted_performance = 3; // router's expected accuracy for this prompt
  double estimated_cost = 4;        // est. USD: exact prompt tokens + avg response
  double utility = 5;               // willingness_to_pay-adjusted score (the rank key)
  int32 rank = 6;                   // 1-based position in this router's ranking
  // reserved 7 to 9;  // response / actual_cost / called (real-call mode, later)
}

// One router's verdict for the prompt: its top pick plus the full ranking.
message RouterDecision {
  string router_type = 1;           // "knn" | "mlp" | "svm"
  string best_model = 2;            // raw model id of the top-ranked candidate
  string best_model_display = 3;    // human label of the top pick
  repeated ModelScore ranking = 4;  // every candidate, ordered best-first
  // Free-form note for caveats (e.g. a router that could not score this prompt).
  string note = 5;
}

message RouteTaskResponse {
  // Echo the request so a client can render without retaining local state.
  string prompt = 1;
  double willingness_to_pay = 2;
  repeated RouterDecision decisions = 3;
}

// ---- Router tuning (TuneRouter / GetTuningStatus) ----

message TuneRouterRequest {
  // Raw uploaded training data (CSV bytes). For mode "labeled" the schema is the
  // RouterBench wide format: a `prompt` column plus one 0/1 correctness column
  // per candidate model (optionally `{model}|model_response`, `eval_name`).
  bytes data = 1;
  // Names the resulting router set; RouteTask selects it via `router_set`.
  // Reusing a name creates a newer run that supersedes the previous one.
  string dataset_name = 2;
  // Router types to fit; empty means all live-routable types (knn/mlp/svm).
  repeated string router_types = 3;
  // Label source. "labeled" (default): the data already carries per-model
  // correctness. "graded" (NOT yet implemented): the data carries ground-truth
  // answers and the service runs + grades each model to produce the labels.
  string mode = 4;
}

message TuneRouterResponse {
  string job_id = 1;
  string dataset_name = 2;
  string status = 3;  // initial status, typically "pending"
}

message TuningStatusRequest {
  string job_id = 1;
}

// Held-out quality of one fitted router: how the model it picks scores on the
// evaluation split, so the user can compare against the baselines below.
message RouterQuality {
  string router_type = 1;
  double routed_accuracy = 2;  // mean correctness of the picked model on the split
  double routed_cost = 3;      // total estimated USD over the split
}

// The quality report for a finished tuning job. routed accuracy sits between the
// best single fixed model (lower-ish reference) and the oracle (upper bound), so
// the user can see whether routing on their data actually helps.
message TuningMetrics {
  int32 train_rows = 1;
  int32 eval_rows = 2;
  double best_single_accuracy = 3;  // best fixed model on the held-out split
  string best_single_model = 4;
  double oracle_accuracy = 5;       // always-pick-a-correct-model upper bound
  repeated RouterQuality routers = 6;
}

message TuningStatusResponse {
  string job_id = 1;
  string dataset_name = 2;
  string status = 3;          // pending | running | succeeded | failed
  string error = 4;           // populated when status == failed
  string run_id = 5;          // the persisted router run id, when succeeded
  TuningMetrics metrics = 6;  // populated when status == succeeded
  repeated string router_types = 7;
}

// ---- Router set listing (ListRouterSets) ----

message ListRouterSetsRequest {}

// One selectable router set (a persisted run, keyed by name). The default set is
// the global benchmark run; the rest are user-tuned sets from TuneRouter.
message RouterSet {
  string name = 1;                  // the router_set value to pass to RouteTask
  bool is_default = 2;              // true for the global benchmark set
  repeated string router_types = 3; // which router types it carries
  int32 model_count = 4;            // number of candidate models it routes among
  string created_at = 5;            // ISO-8601 time of its latest run
}

message ListRouterSetsResponse {
  repeated RouterSet sets = 1;
}

// ---- Tuning upload schema (GetTuningSchema) ----

message GetTuningSchemaRequest {}

// The labeled-upload contract, so a client can render the exact format + a
// template. recognized_models are the only valid model column headers (they must
// be priced, so cost estimates work).
message GetTuningSchemaResponse {
  repeated string recognized_models = 1;
  int32 min_rows = 2;
  int32 min_labels_per_model = 3;
  int32 min_models = 4;
}
