# Brings up the two backend units. The frontend runs separately (npm run dev,
# proxying /api to localhost:8000) or can be added as a third service later.
services:
  # routerbench microservice — gRPC only, not exposed to the host. Only the
  # gateway (on the same compose network) can reach it at routerbench:50051.
  routerbench:
    build: ./services/routerbench
    ports:
      # Prometheus metrics, scrapeable from the host. gRPC (50051) stays internal.
      - "9090:9090"
    environment:
      # Turn on OpenTelemetry tracing and push spans to Tempo over OTLP/gRPC.
      - ROUTERBENCH_TRACING_ENABLED=1
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317
      # MongoDB connection. Used both as the embedding cache (offline pipeline)
      # and as the results store the server loads eval results from at startup
      # (falling back to the bundled .pkl if Mongo has no run yet).
      - CONNECTION_STRING=mongodb://mongo:27017
    volumes:
      # Mount data at runtime instead of baking it into the image.
      - ./services/routerbench/data:/app/data
    depends_on:
      mongo:
        # Results are loaded from Mongo at startup, so wait until it is healthy.
        condition: service_healthy
    healthcheck:
      # Uses the standard gRPC health protocol via the bundled probe. Reports
      # healthy only once results are loaded and the server flips to SERVING.
      test: ["CMD", "python", "-m", "grpc_api.health_probe"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # FastAPI gateway — the only unit exposed to the outside world.
  gateway:
    build: ./gateway
    ports:
      - "8000:8000"
    environment:
      # Reach the microservice by its compose service name.
      - ROUTERBENCH_GRPC_TARGET=routerbench:50051
      # Trace the HTTP entrypoint + the outbound gRPC call, pushed to Tempo. The
      # trace context propagates to the service, so one request = one trace.
      - GATEWAY_TRACING_ENABLED=1
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317
    depends_on:
      routerbench:
        # Wait for the healthcheck to pass, not just for the container to start,
        # so the gateway never sends RPCs before the service is ready (no more
        # startup-race 503s).
        condition: service_healthy

  # MongoDB: the embedding cache backend. Used by the offline pipeline to store
  # and reuse prompt embeddings (keyed by sha256(prompt + model)) instead of the
  # old local .pkl files. Exposed on the host so a pipeline run started outside
  # compose can use CONNECTION_STRING=mongodb://localhost:27017.
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      # Persist the cache across restarts so embeddings survive a `compose down`.
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # mongo-express: lightweight web admin UI for browsing the Mongo cache at
  # http://localhost:8081 (collections, documents, doc counts, simple queries).
  # Dev-only — it is gated behind basic auth and must NOT be exposed publicly.
  mongo-express:
    image: mongo-express:1.0.2
    ports:
      - "8081:8081"
    environment:
      # Point at the Mongo service on the compose network.
      - ME_CONFIG_MONGODB_URL=mongodb://mongo:27017
      - ME_CONFIG_MONGODB_ENABLE_ADMIN=true
      # Basic-auth login for the web UI (change these before any shared use).
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=admin
    depends_on:
      mongo:
        # Wait until Mongo passes its healthcheck so the UI connects cleanly.
        condition: service_healthy

  # ---- Monitoring stack (optional) -----------------------------------------
  # Prometheus scrapes /metrics (pull); Tempo receives traces (push); Grafana is
  # the single pane of glass over both. Open Grafana, not the raw /metrics text.

  # Tempo: trace backend. Receives OTLP spans from the backends on :4317 and
  # serves them to Grafana's Tempo datasource on :3200.
  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo/tempo.yml"]
    ports:
      - "3200:3200"   # Tempo query API (handy for debugging; Grafana uses it too)
    volumes:
      - ./monitoring/tempo/tempo.yml:/etc/tempo/tempo.yml:ro

  # Prometheus: pulls metrics on an interval and stores them as time series.
  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      # Prometheus UI/API on the host at :9091 (9090 is taken by the service's
      # own metrics port mapping above).
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - routerbench
      - gateway

  # Grafana: dashboards + alerting. Datasource and the gRPC dashboard are
  # auto-provisioned, so it works on first boot with no manual setup.
  grafana:
    image: grafana/grafana:11.2.0
    ports:
      # Grafana UI at http://localhost:3001 (3000 is the frontend dev server).
      - "3001:3000"
    environment:
      # Local-dev convenience: open the UI without a login prompt.
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - tempo

# Named volumes
volumes:
  # Durable storage for the MongoDB embedding cache.
  mongo-data:
